name: verify

on:
  push:
  pull_request:

# A pull request runs the shell scripts it ships, so this job is given nothing
# worth stealing: read-only contents, no other scopes, no secrets referenced.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # Pinned to a commit, not a tag: a tag can be moved to point at other code.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0   # the history scan needs the whole history

      # The guards run before anything else: a leak that reaches a public commit
      # is not undone by a later fix.
      - name: Guard calibration + repository scan
        run: make verify

      # A secret deleted from the working tree is still in the history, and the
      # history is what a clone hands to a stranger.
      - name: Scan the full history
        run: ./scripts/sanitize-check.sh --history

      # Internal planning material lives in .local/ and must never be tracked.
      - name: .local stays untracked
        run: |
          tracked=$(git ls-files .local | head -5)
          if [ -n "$tracked" ]; then
            echo "internal files are tracked:"; echo "$tracked"; exit 1
          fi
          echo "ok: .local untracked"
